[project]
name = "ipsec-analyzer"
version = "0.1.0"
description = "Passive IPsec VPN protocol analysis platform"
requires-python = ">=3.11"
dependencies = [
    "scapy",
    "pyyaml",
    "jinja2",
    "textual>=0.80.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
umbra = "ipsec_analyzer.cli:main"
umbra-tui = "ipsec_analyzer.tui.app:main"
ipsec-analyze = "ipsec_analyzer.cli:main"
ipsec-tui = "ipsec_analyzer.tui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Phase 6c: non-.py files a proper `pip install` doesn't bundle unless
# told to — rules.yaml (assessment/rules/schema.py's load_default_rules())
# and the Jinja2 report template (output/report.py) are both read from
# disk at runtime, not embedded in source. Missing either one is a
# FileNotFoundError only once the package is actually installed rather
# than mounted, which the previous (mount-based) Dockerfile never exposed.
"ipsec_analyzer.assessment.rules" = ["rules.yaml"]
"ipsec_analyzer.output" = ["templates/*.j2"]
"ipsec_analyzer.tui" = ["*.tcss"]
