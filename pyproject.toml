[project]
name = "ipsec-analyzer"
version = "0.1.0"
description = "Passive IPsec VPN protocol analysis platform"
requires-python = ">=3.11"
dependencies = [
    "scapy",
    "pyyaml",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "synth"]
