# rules.yaml — the 15 MVP policy rules (MVP_BUILD_PROMPT.md Phase 5).
#
# Rules are data, not code: conditions are structured (op/field/value(s)),
# never a string handed to eval(). See rules/schema.py for the condition
# operators (eq, in, intersects) and the Rule dataclass they parse into.
#
# `target` is a dotted field path looked up in the ClaimLedger via
# `ledger.get(target)`. `min_tier` names a Tier enum member — if the
# ledger has no claim for `target`, or the claim's tier is below
# `min_tier`, this rule is a coverage gap for this capture, not a finding
# (MVP_BUILD_PROMPT.md Phase 5's rule schema). `references` and the
# transform-ID/notify-type values conditions check against are all
# VERIFY BY HAND, same standard as core/constants.py.
#
# `{value}` in `title`/`passed_title`/`recommendation` is replaced at
# finding-generation time with the triggering claim's value (or
# field-extracted sub-value), optionally relabeled via `value_labels` —
# used by rule `partial_downgrade_protection` to literally name the
# deficient endpoint.
#
# `title` names the problem and is what a *finding* prints. `passed_title`
# is the same rule's negative phrasing and is what a *passed check*
# prints: a rule that was checked and came back clean must not render as
# "NULL encryption in use for ESP" in a list of things that are fine.
# Both are required on every rule; see rules/schema.py.

- id: weak_dh_group_negotiated
  title: "Weak Diffie-Hellman group negotiated"
  passed_title: "No weak Diffie-Hellman group negotiated"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    Diffie-Hellman is how the two ends agree on a shared secret while
    somebody is watching the wire. The "group" is the mathematical setting
    that agreement happens in, and it decides how hard the secret is to work
    out from the outside. Groups 1, 2 and 5 use small prime moduli (768,
    1024 and 1536 bits); groups 22 to 24 pair a modulus with a small-order
    subgroup. All six are deprecated for current use. The practical worry is
    recorded traffic: an attacker who stores today's handshake may be able
    to break it later. The negotiated group travels in the clear in
    IKE_SA_INIT, so this is read straight off the wire rather than inferred.
  target: ike_sa.dh_group
  min_tier: OBSERVED
  condition:
    op: in
    values: [1, 2, 5, 22, 23, 24]
  severity: HIGH
  category: key_exchange
  references: ["RFC 3526", "RFC 5114"]
  recommendation: "Negotiate DH group 14 (2048-bit MODP) or higher, or an ECP group (19-21), instead of the weak group in use."
  gap_kind: not_observed_in_capture

- id: ikev1_in_use
  title: "IKEv1 in use"
  passed_title: "IKEv1 not in use"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    IKEv1 is the original key-exchange protocol for IPsec and has been
    formally deprecated (RFC 9395) in favour of IKEv2. Deprecated does not
    mean broken on its own, but it does mean the protocol no longer receives
    scrutiny or new protections, and IKEv1 deployments tend to be old
    configurations nobody has revisited. Worth knowing: this tool reports
    more about IKEv1 than IKEv2 in one respect, because IKEv1 Main Mode
    leaves more of the negotiation in the clear. It does not attempt IKEv1
    SA-parameter extraction. The version number is read from the IKE header.
  target: ike.version
  min_tier: OBSERVED
  condition:
    op: eq
    value: 1
  severity: MEDIUM
  category: protocol_version
  references: ["RFC 9395"]
  recommendation: "Migrate to IKEv2; IKEv1 is deprecated (RFC 9395) and SA-parameter extraction was not attempted for it."
  gap_kind: not_observed_in_capture

- id: ikev1_aggressive_mode
  title: "IKEv1 Aggressive Mode in use"
  passed_title: "IKEv1 Aggressive Mode not in use"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    IKEv1 offers two ways to run its first phase. Main Mode protects the
    peers' identities; Aggressive Mode compresses the exchange into fewer
    round trips and sends identity information in the clear — and, when
    pre-shared-key authentication is used, a hash derived from that shared
    key along with it. Anyone who records the exchange can then attack that
    hash offline, guessing passwords at their own pace with nothing to
    detect the attempt. IKEv2 has no Aggressive Mode exchange type at all,
    so on an IKEv2 capture this check is structurally not applicable rather
    than merely absent.
  target: ike.aggressive_mode
  min_tier: OBSERVED
  condition:
    op: eq
    value: true
  severity: HIGH
  category: protocol_version
  references: ["RFC 2408 §3.1", "RFC 9395"]
  recommendation: "Disable Aggressive Mode; it exposes the peer identity (and, with PSK authentication, a hash usable for offline dictionary attacks) in the clear. Use Main Mode or migrate to IKEv2."
  gap_kind: not_observed_in_capture

- id: downgrade_exposure_mixed_strength
  title: "Downgrade exposure: proposal mixes weak and strong DH groups"
  passed_title: "Key-exchange proposal does not mix weak and strong DH groups"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    An IKEv2 initiator offers a list of key-exchange groups and the
    responder picks one. If that list mixes weak groups with strong ones, an
    attacker sitting on the path can tamper with the offer so the two ends
    settle on the weakest option, while both sides believe they simply
    negotiated normally. A newer IKEv2 extension (notify type 16447) lets
    both peers authenticate the whole handshake transcript afterwards, which
    makes such tampering detectable. This check fires when a mixed-strength
    offer is made *and* that protection is not fully in place. Both the
    offered groups and the notify are plaintext, so this is directly
    observed.
  target: ike_sa_init.downgrade_exposure_severity
  min_tier: OBSERVED
  condition:
    op: eq
    field: reason
    value: MIXED_STRENGTH_GROUPS
  severity: HIGH
  category: downgrade_protection
  references: ["draft-ietf-ipsecme-ikev2-downgrade-prevention-08"]
  recommendation: "Remove weak DH groups from the proposal entirely, or ensure both peers send the full-transcript-authentication notify (16447) so a downgrade attempt is detectable."
  gap_kind: not_observed_in_capture

- id: downgrade_exposure_hybrid_pq
  title: "Downgrade exposure: hybrid post-quantum deployment without full protection"
  passed_title: "No unprotected hybrid post-quantum exposure"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    A hybrid post-quantum deployment (RFC 9370) runs an additional
    post-quantum key exchange alongside the classical one, so that traffic
    recorded today cannot be decrypted later by a quantum computer. The
    weakness this check looks for is specific and unintuitive: if the
    handshake is not protected against tampering, an on-path attacker can
    strip the extra exchange out and leave a classical-only negotiation, and
    neither end will notice. The organisation has paid for post-quantum
    migration and is still exposed to precisely the attack that migration
    was meant to address, which is why this is treated as the most serious
    downgrade exposure.
  target: ike_sa_init.downgrade_exposure_severity
  min_tier: OBSERVED
  condition:
    op: eq
    field: reason
    value: HYBRID_PQ_EXPOSED
  severity: HIGH
  category: downgrade_protection
  references: ["RFC 9370", "draft-ietf-ipsecme-ikev2-downgrade-prevention-08"]
  recommendation: "A hybrid post-quantum key exchange without full downgrade protection can be silently stripped back to classical-only KEX by an on-path attacker; ensure both peers send notify 16447."
  gap_kind: not_observed_in_capture

- id: downgrade_exposure_weak_group_negotiable
  title: "Downgrade exposure: a weak DH group remains negotiable"
  passed_title: "No weak DH group left negotiable"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    This is the milder relative of the mixed-strength check. Here a weak
    key-exchange group appears in the offer but was not the one finally
    selected, and full handshake protection is not in place. The connection
    you are looking at is not itself using the weak group — but the option
    remains on the table, and an attacker able to tamper with the
    negotiation could steer a future handshake onto it. Removing an unused
    weak group from the proposal costs nothing and closes the door. Both the
    offer and the protection state are plaintext, so this is directly
    observed.
  target: ike_sa_init.downgrade_exposure_severity
  min_tier: OBSERVED
  condition:
    op: eq
    field: reason
    value: WEAK_GROUP_NEGOTIABLE
  severity: MEDIUM
  category: downgrade_protection
  references: ["draft-ietf-ipsecme-ikev2-downgrade-prevention-08"]
  recommendation: "Remove the weak DH group from the proposal, even though it wasn't the one ultimately selected — it remains available to a downgrade attempt."
  gap_kind: not_observed_in_capture

- id: partial_downgrade_protection
  title: "Partial downgrade protection: {value} does not support it"
  passed_title: "No one-sided downgrade-protection asymmetry"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    Protection against handshake tampering (notify type 16447) only works if
    *both* peers support it, and that makes a simple yes/no check
    misleading. A responder sends the notify whenever it supports the
    feature, regardless of whether the initiator did — so seeing it in the
    response tells you nothing on its own. There are four possible states:
    both sent it (protected), neither did (no protection), or exactly one
    did. This check fires on those one-sided cases and names which end is
    missing it, because that is the endpoint somebody has to go and upgrade.
  target: ike_sa_init.downgrade_protection_state
  min_tier: OBSERVED
  condition:
    op: in
    values: [PARTIAL_RESPONDER_LACKS, PARTIAL_INITIATOR_LACKS]
  value_labels:
    PARTIAL_RESPONDER_LACKS: "the responder"
    PARTIAL_INITIATOR_LACKS: "the initiator"
  severity: MEDIUM
  category: downgrade_protection
  references: ["draft-ietf-ipsecme-ikev2-downgrade-prevention-08"]
  recommendation: "{value} does not send the full-transcript-authentication notify (16447); protection requires both peers to send it. Upgrade the deficient endpoint's IKE implementation."
  gap_kind: not_observed_in_capture

- id: sixty_four_bit_block_cipher_in_esp
  title: "64-bit block cipher family in use for ESP"
  passed_title: "No 64-bit block cipher family in ESP"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    Block ciphers encrypt in fixed-size chunks. Older ciphers — 3DES, DES,
    Blowfish, CAST — use a 64-bit block, and with a block that small,
    repeated blocks start showing up once enough data has been sent under
    one key, purely by the mathematics of coincidence. That leakage is the
    basis of the Sweet32 class of attacks, and the data volumes involved are
    ordinary for a busy VPN rather than theoretical. This tool does not
    decrypt anything: it recovers the cipher's block alignment from the
    *sizes* of the encrypted packets, which is why this finding is labelled
    as inferred from a side channel rather than observed.
  target: esp.granularity
  min_tier: INFERRED_SIDE_CHANNEL
  condition:
    op: eq
    value: 8
  severity: HIGH
  category: esp_cipher
  references: ["RFC 4303", "RFC 2451"]
  recommendation: "64-bit block ciphers (3DES/DES/Blowfish/CAST) are vulnerable to birthday-bound attacks (e.g. Sweet32) well within realistic traffic volumes. Migrate to an AES-based AEAD suite."
  gap_kind: not_observed_in_capture

- id: truncated_96_bit_icv
  title: "Truncated 96-bit integrity check value"
  passed_title: "No truncated 96-bit integrity check value"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    Every ESP packet carries an integrity check value — a short tag proving
    the packet was not altered in transit. Some older transforms truncate
    that tag to 96 bits. That remains permitted by the standards and is not
    break-today weak, but it leaves a smaller margin than the 128-bit and
    longer tags modern suites use, and there is rarely a reason to prefer it
    now. The tag length is recovered by arithmetic on observed packet sizes,
    anchored on packets whose true size is structurally forced, so it is
    labelled as inferred from a side channel rather than observed.
  target: esp.icv_len
  min_tier: INFERRED_SIDE_CHANNEL
  condition:
    op: intersects
    values: [12]
  severity: MEDIUM
  category: esp_integrity
  references: ["RFC 4303", "RFC 2404"]
  recommendation: "A 96-bit truncated MAC remains standards-permitted but offers a smaller security margin than 128-bit+ alternatives (e.g. HMAC-SHA-256-128, AES-GCM's 128-bit tag); prefer those where supported."
  gap_kind: not_observed_in_capture

- id: null_encryption
  title: "NULL encryption in use for ESP"
  passed_title: "NULL encryption ruled out for ESP"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    ESP can be configured with a NULL cipher, meaning the packets carry
    their integrity tag but no confidentiality at all — the payload travels
    in the clear inside what looks like an encrypted tunnel. This is a
    legitimate setting for debugging a deployment and is never appropriate
    for real traffic. Because it is so serious, this tool will not assert it
    from packet sizes alone: it reads a sample of the payload bytes and asks
    whether they actually parse as a plain IP header. Real encrypted traffic
    is indistinguishable from random noise and essentially never does, so
    NULL encryption is ruled out unless there is positive evidence for it.
  target: esp.null_encryption_confirmed
  min_tier: INFERRED_SIDE_CHANNEL
  condition:
    op: eq
    value: true
  severity: HIGH
  category: esp_cipher
  references: ["RFC 2410"]
  recommendation: "This traffic has no confidentiality protection at all. Confirm this is intentional (e.g. a debugging/testing deployment) and never route production traffic through it unencrypted."
  gap_kind: not_observed_in_capture

- id: ah_in_use
  title: "AH in use (deprecated)"
  passed_title: "AH not in use"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    IPsec has two protocols for protecting packets. AH authenticates a
    packet and parts of its outer header but provides no confidentiality
    whatsoever; ESP can provide both, and is what essentially all modern
    deployments use. Seeing AH is therefore worth noting — it may be
    deliberate, since AH covers some outer-header fields that ESP does not,
    but far more often it is a legacy configuration. This is flagged as
    informational rather than as a vulnerability. Detection is simply the IP
    protocol number on the wire, so it is directly observed.
  target: ah.detected
  min_tier: OBSERVED
  condition:
    op: eq
    value: true
  severity: LOW
  category: protocol_version
  references: ["RFC 4301", "RFC 4302"]
  recommendation: "AH provides integrity but no confidentiality and is largely superseded by ESP (which can provide both). Migrate to ESP unless AH's specific properties (e.g. protecting outer IP header fields) are a hard requirement."
  gap_kind: not_observed_in_capture

- id: weak_ike_sa_cipher
  title: "Weak IKE SA cipher (DES / 3DES)"
  passed_title: "No weak IKE SA cipher (DES / 3DES)"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    This is about the cipher protecting the *key-exchange conversation*
    itself, not the tunnelled traffic. DES has been breakable by brute force
    for decades, and 3DES inherits the 64-bit block problem described under
    the ESP block-cipher check while being slow besides; current guidance
    (RFC 8247) recommends against both. It matters because the IKE SA is
    where identities are exchanged and where the keys for the data tunnel
    are derived. The negotiated cipher appears in the plaintext IKE_SA_INIT
    exchange, so this is read directly rather than inferred.
  target: ike_sa.encryption
  min_tier: OBSERVED
  condition:
    op: in
    field: transform_id
    values: [1, 2, 3, 11]
  severity: HIGH
  category: ike_cipher
  references: ["RFC 2409", "RFC 8247"]
  recommendation: "DES and 3DES are cryptographically weak by modern standards (RFC 8247 recommends against them). Migrate the IKE SA to an AES-based cipher."
  gap_kind: not_observed_in_capture

- id: weak_ike_sa_integrity
  title: "Weak IKE SA integrity (MD5 / SHA-1)"
  passed_title: "No weak IKE SA integrity (MD5 / SHA-1)"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    The integrity transform is what stops anyone tampering with the
    key-exchange messages themselves. Transforms built on MD5 and SHA-1 are
    deprecated (RFC 8247): both hash functions have known collision
    weaknesses, and while a collision is not automatically an attack on the
    authentication code built from them, there is no reason to keep relying
    on primitives that have been failing for years. SHA-2-based transforms
    are the current recommendation. Like the cipher, this is negotiated in
    the clear in IKE_SA_INIT and read directly.
  target: ike_sa.integrity
  min_tier: OBSERVED
  condition:
    op: in
    values: [1, 2, 4, 6, 7]
  severity: MEDIUM
  category: ike_integrity
  references: ["RFC 2409", "RFC 8247"]
  recommendation: "MD5- and SHA-1-based integrity transforms are deprecated (RFC 8247). Migrate the IKE SA to a SHA-2-based integrity transform (e.g. HMAC-SHA2-256-128)."
  gap_kind: not_observed_in_capture

- id: pfs_not_observable
  title: "Perfect Forward Secrecy: not observable from this capture"
  passed_title: "Perfect Forward Secrecy observed as enabled"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    Perfect Forward Secrecy means each tunnel gets a freshly agreed key, so
    that compromising one key later does not expose traffic protected by the
    others. Whether it is enabled is signalled by a key-exchange payload
    inside the CREATE_CHILD_SA exchange — which this build does not parse.
    That is a limitation of this tool, not of passive analysis: the
    information is present on the wire and a future version could read it.
    Until then this check reports honestly that it does not know, rather
    than assuming a default. Verify it against both endpoints' configuration
    directly.
  target: child_sa.pfs
  min_tier: OBSERVED
  condition:
    op: eq
    value: false
  severity: INFO
  category: coverage
  references: ["RFC 7296 §1.3"]
  recommendation: "PFS is signaled by a KE payload in CREATE_CHILD_SA, which this MVP does not parse (out of scope). Verify PFS configuration directly against both endpoints' policy."
  gap_kind: not_implemented

- id: anti_replay_not_observable
  title: "Anti-replay window enforcement: never observable from a passive capture"
  passed_title: "Anti-replay window enforcement observed as enabled"
  # VERIFY BY HAND — plain-language explanation of what this check
  # means; same review standard as core/constants.py. Describes the
  # CHECK, never this capture's result.
  explanation: >-
    Anti-replay protection means a receiver refuses packets it has already
    seen, so an attacker cannot capture traffic and replay it later. The
    sequence number this relies on is present in every ESP packet whether or
    not the receiver actually checks it — enforcement is a decision made
    inside the receiving host and is never signalled on the wire. No passive
    observer can determine it, from this capture or any other, and a tool
    that reports it is guessing. This is the clearest example of why the
    report distinguishes "we could not tell" from "it is fine": here, "could
    not tell" is the only truthful answer available.
  target: esp.anti_replay_enabled
  min_tier: OBSERVED
  condition:
    op: eq
    value: false
  severity: INFO
  category: coverage
  references: ["RFC 4303 §3.4.3"]
  recommendation: "Anti-replay window enforcement is a receiver-side policy decision never signaled on the wire — the sequence number is present in every ESP packet regardless of whether the receiver checks it. Verify directly against both endpoints' configuration."
  gap_kind: structurally_unobservable
