services:
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ipsec-analyzer:dev
    volumes:
      - .:/work
    working_dir: /work
    entrypoint: ["ipsec-analyze"]
    environment:
      - PYTHONPATH=/work/src

  tui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ipsec-analyzer:dev
    volumes:
      - .:/work
    working_dir: /work
    entrypoint: ["ipsec-tui"]
    stdin_open: true
    tty: true
    environment:
      - PYTHONPATH=/work/src
      - TERM=xterm-256color
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: ipsec-analyzer:dev
    volumes:
      - .:/work
    working_dir: /work
    entrypoint: ["pytest"]
    command: ["tests/", "-v"]
    environment:
      - PYTHONPATH=/work/src
